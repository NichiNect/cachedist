version: '3.8'

services:
  node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: node1
    environment:
      - CACHE_NODE_ID=node1
      - CACHE_HTTP_PORT=7001
      - CACHE_GRPC_PORT=8001
      - CACHE_PEERS=node2:8002,node3:8003
    ports:
      - "7001:7001"
      - "8001:8001"
    networks:
      - cachedist

  node2:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: node2
    environment:
      - CACHE_NODE_ID=node2
      - CACHE_HTTP_PORT=7002
      - CACHE_GRPC_PORT=8002
      - CACHE_PEERS=node1:8001,node3:8003
    ports:
      - "7002:7002"
      - "8002:8002"
    networks:
      - cachedist

  node3:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: node3
    environment:
      - CACHE_NODE_ID=node3
      - CACHE_HTTP_PORT=7003
      - CACHE_GRPC_PORT=8003
      - CACHE_PEERS=node1:8001,node2:8002
    ports:
      - "7003:7003"
      - "8003:8003"
    networks:
      - cachedist

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - cachedist

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    networks:
      - cachedist
    depends_on:
      - prometheus

  # Redis service for comparison benchmarks
  # redis:
  #   image: redis:alpine
  #   container_name: redis
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - cachedist

networks:
  cachedist:
    driver: bridge
